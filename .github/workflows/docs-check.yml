name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-readme-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate relative README links
        run: python3 scripts/check_readme_links.py
